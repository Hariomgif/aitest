<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Class Test — Result Time!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky: #EAF6FF;
    --sun: #FFC857;
    --coral: #FF6F59;
    --mint: #3DDC97;
    --grape: #8E6FFF;
    --ink: #26324A;
    --ink-soft: #5B6A87;
    --card: #FFFFFF;
    --gold: #F4B400;
    --gold-deep: #C98A00;
    --silver: #9AA7C2;
    --silver-deep: #5F6E8E;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,200,87,0.35), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(61,220,151,0.30), transparent 38%),
      radial-gradient(circle at 85% 90%, rgba(142,111,255,0.25), transparent 42%),
      var(--sky);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 44px 18px 70px;
  }

  .sheet{ width:100%; max-width: 540px; }

  header{ text-align:center; margin-bottom: 26px; }

  .robot{ font-size: 54px; line-height:1; margin-bottom: 4px; }

  h1{
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 36px;
    line-height: 1.1;
    margin: 4px 0 8px;
    color: var(--grape);
  }

  .sub{
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 34ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .entry-card{
    background: var(--card);
    border-radius: 24px;
    padding: 24px 22px;
    box-shadow: 0 10px 24px rgba(38,50,74,0.08);
  }

  label{
    display:block;
    font-family:'Baloo 2', cursive;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .input-row{ display:flex; gap: 10px; }

  input[type="text"]{
    flex:1;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 17px;
    padding: 13px 16px;
    border: 2px solid #E3E9F5;
    border-radius: 14px;
    background: #F8FAFF;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }

  input[type="text"]:focus{ border-color: var(--grape); background: #fff; }

  button{
    font-family: 'Baloo 2', cursive;
    font-size: 16px;
    font-weight: 700;
    background: var(--coral);
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
    flex-shrink:0;
  }

  button:hover{ background: #FF5942; transform: translateY(-1px); }
  button:active{ transform: translateY(0); }
  button:focus-visible{ outline: 3px solid var(--grape); outline-offset: 2px; }

  .hint{
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    min-height: 16px;
  }

  .hint.error{ color: var(--coral); }

  #result{ margin-top: 22px; }

  .result-card{
    background: var(--card);
    border-radius: 26px;
    padding: 30px 24px 26px;
    position: relative;
    overflow:hidden;
    box-shadow: 0 12px 28px rgba(38,50,74,0.10);
    animation: pop 0.35s ease;
  }

  @keyframes pop{
    from{ opacity:0; transform: scale(0.96) translateY(6px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .result-card.captain{ box-shadow: 0 12px 28px rgba(244,180,0,0.28); }
  .result-card.vice{ box-shadow: 0 12px 28px rgba(90,110,142,0.22); }

  .medal{
    position:absolute;
    top: 18px;
    right: 20px;
    font-size: 44px;
    line-height:1;
    transform: rotate(8deg);
  }

  .name{
    font-family:'Baloo 2', cursive;
    font-size: 28px;
    font-weight: 800;
    color: var(--grape);
    margin: 0 0 2px;
    max-width: 75%;
  }

  .tier-label{
    font-family:'Baloo 2', cursive;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .rank-pill{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    background: #F0EBFF;
    color: var(--grape);
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
    display:flex;
    align-items:center;
    gap: 14px;
    background: #F8FAFF;
    border-radius: 18px;
    padding: 14px 18px;
    margin-top: 4px;
  }

  .score-big{
    font-family:'Baloo 2', cursive;
    font-weight: 800;
    font-size: 40px;
    color: var(--ink);
  }

  .score-out-of{
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .score-bar-wrap{
    flex:1;
    height: 12px;
    background: #E3E9F5;
    border-radius: 999px;
    overflow:hidden;
  }

  .score-bar{
    height:100%;
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  .badges{ margin-top: 16px; display:flex; flex-wrap:wrap; gap:8px; }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding: 7px 14px;
    border-radius: 999px;
    font-family:'Baloo 2', cursive;
    font-size: 13px;
    font-weight: 700;
  }

  .badge.captain{ background: #FFF3D6; color: var(--gold-deep); }
  .badge.vice{ background: #EDF0F9; color: var(--silver-deep); }

  .message{
    margin-top: 18px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink);
  }

  .tips{
    margin-top: 14px;
    background: #F8FAFF;
    border-radius: 16px;
    padding: 14px 16px;
  }

  .tips-title{
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .tips ul{
    margin: 0;
    padding-left: 18px;
  }

  .tips li{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .tips li:last-child{ margin-bottom: 0; }

  footer{
    margin-top: 34px;
    text-align:center;
    font-size: 12px;
    color: var(--ink-soft);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="robot">🤖</div>
    <h1>AI Test Results Are In!</h1>
    <p class="sub">Type your name below to see how you did — and check for a special surprise!</p>
  </header>

  <div class="entry-card">
    <label for="nameInput">What's your name?</label>
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
      <button id="showBtn">See my result</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="result"></div>

  <footer>🏅 Top scorer among the boys and among the girls becomes Class Captain.<br>🥈 Anyone who scored 19 (and isn't already Captain) becomes Vice Captain!</footer>
</div>

<script>
  const students = [
    { name: "Piyush Sharma",      marks: 0,  gender: "M" },
    { name: "Mudra Dhumal",       marks: 17, gender: "F" },
    { name: "Sarvesh Gaikwad",    marks: 18, gender: "M" },
    { name: "Rudra Dane",         marks: 4,  gender: "M" },
    { name: "Mahi Punde",         marks: 20, gender: "F" },
    { name: "Sairaj Dane",        marks: 17, gender: "M" },
    { name: "Anvi Baringe",       marks: 13, gender: "F" },
    { name: "Samruddhi Gawai",    marks: 15, gender: "F" },
    { name: "Nihal Chavhan",      marks: 19, gender: "M" },
    { name: "Rushikesh Unnale",   marks: 7,  gender: "M" },
    { name: "Dishita Buddhadeo",  marks: 12, gender: "F" },
    { name: "Mansvi Dhumale",     marks: 12, gender: "F" },
    { name: "Shreyas Chore",      marks: 15, gender: "M" },
    { name: "Shrihari Dhumale",   marks: 18, gender: "M" },
    { name: "Priyal Sardar",      marks: 13, gender: "F" },
    { name: "Advika Bayas",       marks: 0,  gender: "F" },
    { name: "Vivek Aghao",        marks: 16, gender: "M" },
    { name: "Arijit Paraskar",    marks: 15, gender: "M" },
    { name: "Kranti Adave",       marks: 18, gender: "F" },
    { name: "Anvi Vhonmane",      marks: 18, gender: "F" },
    { name: "Vedika Patil",       marks: 19, gender: "F" },
    { name: "Sejal Napte",        marks: 8,  gender: "F" },
    { name: "Abhay Nimbolkar",    marks: 5,  gender: "M" },
    { name: "Swara Lingade",      marks: 15, gender: "F" },
    { name: "Ananya Misal",       marks: 7,  gender: "F" },
    { name: "Devansh Nikalje",    marks: 15, gender: "M" }
  ];

  const maxBoys  = Math.max(...students.filter(s => s.gender === "M").map(s => s.marks));
  const maxGirls = Math.max(...students.filter(s => s.gender === "F").map(s => s.marks));

  // Standard competition ranking (1224 style): students with equal marks
  // share the same rank, and the next distinct score skips ahead accordingly.
  const rankByName = (() => {
    const sorted = [...students].sort((a, b) => b.marks - a.marks);
    const map = new Map();
    let rank = 0;
    let prevMarks = null;
    sorted.forEach((s, i) => {
      if (s.marks !== prevMarks){
        rank = i + 1;
        prevMarks = s.marks;
      }
      map.set(normalize(s.name), rank);
    });
    return map;
  })();

  function tiedCount(marks){
    return students.filter(s => s.marks === marks).length;
  }

  const nameInput = document.getElementById('nameInput');
  const showBtn = document.getElementById('showBtn');
  const hint = document.getElementById('hint');
  const resultEl = document.getElementById('result');

  function normalize(str){ return str.trim().toLowerCase().replace(/\s+/g, ' '); }
  function firstName(fullName){ return normalize(fullName).split(' ')[0]; }

  function findStudent(query){
    const q = normalize(query);
    const exact = students.find(s => normalize(s.name) === q);
    if (exact) return { student: exact };
    const byFirstName = students.filter(s => firstName(s.name) === q);
    if (byFirstName.length === 1) return { student: byFirstName[0] };
    if (byFirstName.length > 1) return { multiple: byFirstName };
    return null;
  }

  // Friendly tiers for 5th standard students — every band gets encouragement
  // plus a couple of concrete things to try before the next test.
  function getTier(marks){
    if (marks >= 18) return {
      label: "Superstar score! ⭐",
      color: "var(--mint)",
      note: "That is an amazing score — you really know your AI!",
      tips: [
        "Try teaching a friend one thing you learned — it helps it stick even more.",
        "Look for a slightly harder AI question or fact to explore next."
      ]
    };
    if (marks >= 14) return {
      label: "Great job! 🎉",
      color: "var(--sun)",
      note: "Nice work! You're getting really good at this.",
      tips: [
        "Go back over the questions you weren't fully sure about.",
        "Practice explaining your answers out loud — it builds confidence for the next test."
      ]
    };
    if (marks >= 8) return {
      label: "Good effort! 💪",
      color: "var(--grape)",
      note: "Good try! A little more practice and you'll shine even brighter.",
      tips: [
        "Pick your weakest topic and spend 10 minutes a day on it this week.",
        "Ask your teacher or a classmate to explain the tricky parts again.",
        "Redo the questions you missed once you know the right answers."
      ]
    };
    return {
      label: "Keep going! 🌱",
      color: "var(--coral)",
      note: "Everyone starts somewhere — let's practice together for the next test!",
      tips: [
        "Start with just one topic at a time instead of everything at once.",
        "Ask your teacher for extra help this week — that's what they're there for.",
        "Try short 10-minute practice sessions rather than one long one."
      ]
    };
  }

  function render(student){
    hint.textContent = '';
    hint.classList.remove('error');

    const isCaptain =
      (student.gender === 'M' && student.marks === maxBoys) ||
      (student.gender === 'F' && student.marks === maxGirls);
    const isVice = student.marks === 19 && !isCaptain;

    const tier = getTier(student.marks);
    const pct = Math.round((student.marks / 20) * 100);
    const rank = rankByName.get(normalize(student.name));
    const tieCount = tiedCount(student.marks);
    const rankText = tieCount > 1
      ? `Rank ${rank} of ${students.length} (tied with ${tieCount - 1} other${tieCount - 1 > 1 ? 's' : ''})`
      : `Rank ${rank} of ${students.length}`;

    let cardClass = 'result-card';
    if (isCaptain) cardClass += ' captain';
    else if (isVice) cardClass += ' vice';

    let medalHtml = '';
    if (isCaptain) medalHtml = `<div class="medal">🏅</div>`;
    else if (isVice) medalHtml = `<div class="medal">🥈</div>`;

    let badgesHtml = '';
    if (isCaptain){
      badgesHtml += `<span class="badge captain">🏅 ${student.gender === 'M' ? 'Boys' : 'Girls'} Class Captain</span>`;
    }
    if (isVice){
      badgesHtml += `<span class="badge vice">🥈 Vice Captain</span>`;
    }

    let specialMessage = '';
    if (isCaptain){
      specialMessage = `<div class="message">🎊 Congratulations! You scored the highest among the ${student.gender === 'M' ? 'boys' : 'girls'} — you're the new Class Captain!</div>`;
    } else if (isVice){
      specialMessage = `<div class="message">🎊 Congratulations! Scoring 19 out of 20 makes you Vice Captain!</div>`;
    } else {
      specialMessage = `<div class="message">${tier.note}</div>`;
    }

    const tipsHtml = `
      <div class="tips">
        <div class="tips-title">Things to try before the next test</div>
        <ul>${tier.tips.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
    `;

    resultEl.innerHTML = `
      <div class="${cardClass}">
        ${medalHtml}
        <p class="name">${student.name}</p>
        <div class="tier-label" style="color:${tier.color}">${tier.label}</div>
        <div class="rank-pill">🏆 ${rankText}</div>
        <div class="score-row">
          <div class="score-big">${student.marks}<span class="score-out-of">/20</span></div>
          <div class="score-bar-wrap">
            <div class="score-bar" style="width:${pct}%; background:${tier.color}"></div>
          </div>
        </div>
        <div class="badges">${badgesHtml}</div>
        ${specialMessage}
        ${tipsHtml}
      </div>
    `;
  }

  function handleSearch(){
    const query = nameInput.value;
    if (!query.trim()){
      hint.textContent = 'Type your name to see your result!';
      hint.classList.add('error');
      resultEl.innerHTML = '';
      return;
    }
    const found = findStudent(query);
    if (!found){
      hint.textContent = "Hmm, we couldn't find that name — check the spelling and try again!";
      hint.classList.add('error');
      resultEl.innerHTML = '';
      return;
    }
    if (found.multiple){
      hint.textContent = `A couple of students share that name — type your full name to find your result!`;
      hint.classList.add('error');
      resultEl.innerHTML = '';
      return;
    }
    render(found.student);
  }

  showBtn.addEventListener('click', handleSearch);
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });
</script>
</body>
</html>
